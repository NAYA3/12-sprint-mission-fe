<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/index.css">
    <title>판다마켓</title>
</head>
<body>
    <!--HEADER-->
    <header class="gnb">
        <nav class="nav">
            <a id="logo" href="./index.html">
                <img src="./image/logo.png"></a>
            <a id="login" href="./login.html">
                로그인</a>
        </nav>
    </header>
    <!--HERO-->
    <hero class="hero">
        <div class="hero_inner">
            <div class="hero_section1">
                <h2 class="h2">일상의 모든 물건을<br>
                    거래해 보세요
                </h2>
                <a id="btn_large" href="./items.html">
                    구경하러 가기</a>
            </div>
            <img src="./image/Img_hero.png">
        </div>
    </hero>
    <!--MAIN-->
    <main>
        <section class="section">
            <div class="section_inner">
                <img src="./image/Img_home_01.png">
                <div class="section_aticle1">
                    <label>Hot item</label>
                    <h2 class="h2">인기 상품을<br>
                        확인해 보세요
                    </h2>
                    <p>가장 HOT한 중고거래 물품을<br>
                        판다 마켓에서 확인해보세요
                    </p>
                </div>
            </div>

        </section>
        <section class="section">
            <div class="section_inner">
               <div class="section_aticle2">
                    <label>serch</label>
                    <h2 class="h2">구매를 원하는<br>
                        상품을 검색하세요
                    </h2>
                    <p>구매하고 싶은 물품은 검색해서<br>
                        쉽게 찾아보세요
                    </p>
                </div>
                <img src="./image/Img_home_02.png">
            </div>
        </section>
        <section class="section">
            <div class="section_inner">
                <img src="./image/Img_home_03.png">
                <div class="section_aticle1">
                    <label>Register</label>
                    <h2 class="h2">판매를 원하는<br>
                        상품을 등록하세요
                    </h2>
                    <p>어떤 물건이든 판매하고 싶은 상품을<br>
                        쉽게 등록하세요
                    </p>
                </div>
            </div>
        </section>
    </main>
    <!--BOTTOM-->
    <bottom class="bottom">
        <div class="bottom_inner">
                <h2 class="ti">믿을 수 있는<br>
                    판다마켓 중고 거래
                </h2>
            <img src="./image/Img_home_bottom.png">
        </div>
    </bottom>
    <!--FOOTER-->
    <footer class="footer">
        <div class="footer_inner">
            <p>©codeit - 2024</p>
            <!--링크 태그로 변경할 것-->
            <ul>
                <li>Privacy Policy</li>
                <li>FAQ</li>
            </ul>
            <div id="social">
                <a href="https://facebook.com" target="_blank">
                    <img src="./image/ic_facebook.png"></a>
                <a href="https://twitter.com" target="_blank">
                    <img src="./image/ic_twitter.png"></a>
                <a href="https://youtube.com" target="_blank">
                    <img src="./image/ic_youtube.png"></a>
                <a href="https://instagram.com" target="_blank">
                    <img src="./image/ic_instagram.png"></a>
            </div>
        </div>
    </footer>

</html>
