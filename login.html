<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/login.css">
    <title>로그인</title>
</head>
<body>
    <main class="main">
        <form class="form">
            <a id="logo" href="./index.html">
                <img src="./image/logo.png"></a>
            <div class="form_inner">
                <label for="email">
                    이메일</label>
                <input class="form_input" type="email" name="email" placeholder="이메일을 입력해주세요">
            </div>
           <div class="form_inner">
                <label for="password">
                    비밀번호</label>
                <input class="form_input" type="password" name="password" placeholder="비밀번호를 입력해주세요">
            </div>
            <a id="btn_large" href="">로그인</a>
            <div class="login_container">
            <p>간편 로그인하기</p>
                <div class="login_social">
                    <a href="https://www.google.com/">
                        <img src="./image/ic_google.png"></a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="./image/ic_kakaotalk.png"></a>
                </div>
            </div>
            <div class="footer">
                <p>판다마켓이 처음이신가요?</p>
                <a href="./signup.html">회원가입</a>
            </div>
        </form>
    </main>
    
</body>
</html>
